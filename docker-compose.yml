services:
  auction-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auctions
    ports:
      - "5432:5432"
    volumes:
      - auction-data:/var/lib/postgresql/data

  identity-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identity
    ports:
      - "5433:5432"
    volumes:
      - identity-data:/var/lib/postgresql/data

  bidding-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bidding
    ports:
      - "5434:5432"
    volumes:
      - bidding-data:/var/lib/postgresql/data
      
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  auction-data:
  identity-data:
  bidding-data:

